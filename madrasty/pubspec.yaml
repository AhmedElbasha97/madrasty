name: madrasty
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.1+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path: ^1.9.0
  flutter_file_dialog: ^3.0.2
  screenshot: ^3.0.0
  draggable_fab: ^0.1.1
  printing: ^5.13.4
  getwidget: ^3.1.1
  cool_alert: ^2.0.1
  cached_network_image: ^3.4.1
  get: ^4.6.6
  dio: ^5.7.0
  carousel_slider: ^5.0.0
  connectivity_plus: ^6.1.0
  pretty_dio_logger: ^1.4.0
  flashy_tab_bar2: ^0.0.6
  share_plus: ^7.2.2
  permission_handler: ^11.3.1
  path_provider: ^2.1.5
  upgrader: ^8.4.0
  in_app_update: ^4.2.2
  shared_preferences: ^2.3.5
  flutter_animate: ^4.5.2
  file_picker: ^9.0.0
  map_launcher: ^3.5.0
  flutter_html: ^3.0.0-alpha.3
  pdf: ^3.11.1
  url_launcher: ^6.3.1
  video_player: ^2.9.2
  local_auth: ^2.3.0
  star_rating: ^0.11.0
  in_app_review: ^2.0.9
  image_picker: ^1.1.2
  easy_localization: ^3.0.7
  double_back_to_close_app: ^2.1.0
  flutter_rating_bar: ^4.0.1
  flutter_svg: ^2.0.17
  pinch_zoom: ^1.0.0
  webview_flutter: ^4.10.0
  flutter_native_splash: ^2.4.4
  firebase_messaging: ^15.2.1
  firebase_core: ^3.10.1
  geolocator: ^9.0.2
  geocoding: ^2.0.5
  google_maps_flutter: ^2.10.0
  intl: ^0.20.2
  bubble: ^1.2.1
  flutter_pdfview: 1.3.2
  video_compress: ^3.1.4
  flutter_linkify: ^6.0.0
  flutter_tawkto: ^0.0.5
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0



# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter_native_splash:
    color: "#feb92c"
    image: assets/images/appicon.png
    branding: assets/images/appicon.png
    color_dark: "#213462"
    image_dark: assets/images/appicon.png
    branding_dark: assets/images/appicon.png

    android_12:
      image: assets/images/appicon.png
      icon_background_color: "#feb92c"
      image_dark: assets/images/appicon.png
      icon_background_color_dark: "#213462"

    web: false
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/icons/
    - assets/images/

  fonts:
    - family: Al-Mujahed_Al-Anbobi
      fonts:
        - asset: assets/fonts/Bahij_TheSansArabic-Plain.ttf
          weight: 700
        - asset: assets/fonts/Bahij TheSansArabic.ttf
          weight: 600
        - asset: assets/fonts/Bahij_TheSansArabic-ExtraBold.ttf
          weight: 900
        - asset: assets/fonts/alfont_com_AlFont_com_Bahij_TheSansArabic-Bold-1.ttf
          weight: 800
    - family: alois
      fonts:
        - asset: assets/fonts/Alois.ttf
          weight: 600
        - asset: assets/fonts/Alois.ttf
          weight: 700
        - asset: assets/fonts/alois-heavy_bigfontsite.com.ttf
          weight: 800
        - asset: assets/fonts/Alois Bold.ttf
          weight: 900
